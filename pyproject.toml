[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-demo"
version = "0.1.0"
description = "Local-first AI film direction and sequential media generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ffmpeg-python>=0.2.0,<1",
  "httpx>=0.28,<1",
  "openai>=1.65,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
director-demo = "director_demo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["director_demo"]
